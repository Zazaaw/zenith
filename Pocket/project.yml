#
# Zenith Pocket, the iPhone and Apple Watch companion of Zenith.
# `xcodegen generate` turns this into Pocket.xcodeproj, which is not
# committed. Install with ./install.sh.
#
# Four targets, so four App IDs on a free Personal Team (it allows ten new
# ones a week): the iPhone app, its widget extension, the Watch app embedded
# in it, and the Watch app's widget extension (its complications), all under
# id.satuvisual.zenith.pocket. The iPhone app and its widgets share an App
# Group (the latest state) and a Keychain group (the pairing), as the Watch
# app and its complications do.

name: Pocket
options:
  bundleIdPrefix: id.satuvisual.zenith
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

packages:
  PocketKit:
    path: PocketKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # From POCKET_TEAM when the project is generated: install.sh sets it (the
    # env or the team Xcode knows), so the project opened in Xcode keeps it.
    DEVELOPMENT_TEAM: "${POCKET_TEAM}"

targets:
  Pocket:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PocketKit
      - target: PocketWatch
      - target: PocketWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.satuvisual.zenith.pocket
        PRODUCT_NAME: Pocket
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # The splash's background, light or dark, so launch flows into it.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-ExtraBold.ttf
        NSCameraUsageDescription: Pocket uses the camera to scan the pairing code Zenith shows on your Mac.
        NSFaceIDUsageDescription: Pocket asks for Face ID before a reply reaches Claude Code on your Mac.
        NSMicrophoneUsageDescription: Pocket listens while you dictate a reply to Claude Code.
        NSSpeechRecognitionUsageDescription: Pocket turns what you dictate into the text of your reply to Claude Code.
        CFBundleURLTypes:
          - CFBundleURLName: id.satuvisual.zenith.pocket.pair
            CFBundleURLSchemes: [zenith-pocket]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - id.satuvisual.zenith.pocket.report
        PocketKeychainGroup: $(AppIdentifierPrefix)id.satuvisual.zenith.pocket.shared
    entitlements:
      path: App/Pocket.entitlements
      properties:
        com.apple.security.application-groups: [group.id.satuvisual.zenith.pocket]
        keychain-access-groups: [$(AppIdentifierPrefix)id.satuvisual.zenith.pocket.shared]
    scheme: {}

  # The iPhone's widgets, Lock Screen accessories and Control Center
  # controls. They share the pairing store, the widgets' file and the theme
  # with the app, and its fonts.
  PocketWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: App/Model/PairingStore.swift
      - path: App/Model/WidgetVault.swift
      - path: App/Views/Theme.swift
      - path: App/Resources/Fonts
    dependencies:
      - package: PocketKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.satuvisual.zenith.pocket.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-ExtraBold.ttf
        PocketKeychainGroup: $(AppIdentifierPrefix)id.satuvisual.zenith.pocket.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PocketWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.id.satuvisual.zenith.pocket]
        keychain-access-groups: [$(AppIdentifierPrefix)id.satuvisual.zenith.pocket.shared]

  # The Watch app: a single-target watchOS app, embedded in Pocket so it
  # installs with it. It shares PocketKit and the companion star.
  PocketWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: WatchShared
      - path: App/Views/ClaudeMascot.swift
      - path: App/Views/StarShape.swift
    dependencies:
      - package: PocketKit
      - target: PocketWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.satuvisual.zenith.pocket.watchkitapp
        PRODUCT_NAME: PocketWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: id.satuvisual.zenith.pocket
        WKRunsIndependentlyOfCompanionApp: false
        PocketKeychainGroup: $(AppIdentifierPrefix)id.satuvisual.zenith.pocket.shared
    entitlements:
      path: Watch/PocketWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.id.satuvisual.zenith.pocket]
        keychain-access-groups: [$(AppIdentifierPrefix)id.satuvisual.zenith.pocket.shared]
    # Its own scheme: building it once with the Watch as the destination is
    # what registers the Watch with the team and puts it in the profiles.
    scheme: {}

  # The Watch app's complications and Smart Stack card.
  PocketWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: WatchShared
    dependencies:
      - package: PocketKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.satuvisual.zenith.pocket.watchkitapp.widgets
        SKIP_INSTALL: YES
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PocketKeychainGroup: $(AppIdentifierPrefix)id.satuvisual.zenith.pocket.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/PocketWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.id.satuvisual.zenith.pocket]
        keychain-access-groups: [$(AppIdentifierPrefix)id.satuvisual.zenith.pocket.shared]
